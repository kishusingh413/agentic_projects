[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-intel"
version = "0.1.0"
description = "LangGraph pipeline for clothing store competitor intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.55",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.2.14",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "duckduckgo-search>=6.1.0",
    "tavily-python>=0.5.0",
]

[project.scripts]
competitor-intel = "competitor_intel.main:main"

[tool.setuptools.packages.find]
where = ["src"]
